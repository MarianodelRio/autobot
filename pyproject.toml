[project]
name = "autobot"
version = "0.1.0"
description = "Multi-tenant platform that serves small businesses' customers over WhatsApp or Telegram."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "django>=5.2,<5.3",
    "procrastinate[django]>=3.10,<4",
    "psycopg[binary]>=3.3.6,<3.4",
    "pydantic>=2.14,<3",
    "google-api-python-client>=2,<3",
    "httpx>=0.28,<0.29",
    "gunicorn>=23,<27",
    "django-otp>=1.7,<2",
    "dj-database-url>=3",
    "pyyaml>=6.0,<7",
    "sentry-sdk>=2,<3",
    "whitenoise>=6.12,<7",
]

[dependency-groups]
dev = [
    "ruff>=0.17.2",
    "mypy>=1.18",
    "django-stubs[compatible-mypy]>=5.2.9,<5.3",
    "pytest>=8.4",
    "pytest-django>=4.11",
    "weasyprint>=66",
    "import-linter>=2.15,<3",
    "django-migration-linter>=6,<7",
    "types-pyyaml>=6",
    "qrcode>=8.2,<9",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests", "tools"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "DJ"]

[tool.ruff.lint.isort]
known-first-party = ["core", "integrations", "packs", "autobot", "config", "tools"]

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
strict = true
plugins = ["mypy_django_plugin.main"]
explicit_package_bases = true
files = ["src", "tests", "tools", "manage.py"]

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["src"]
testpaths = ["tests", "src"]
addopts = "--strict-markers"

# Module dependency rules. Run with `PYTHONPATH=src lint-imports`.
[tool.importlinter]
root_packages = ["core", "integrations", "packs", "autobot", "config"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core imports nothing from the project nor Django"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = ["integrations", "packs", "autobot", "config", "django"]

[[tool.importlinter.contracts]]
name = "integrations only imports core (no Django)"
type = "forbidden"
source_modules = ["integrations"]
forbidden_modules = ["packs", "autobot", "config", "django"]

[[tool.importlinter.contracts]]
name = "packs only import core (no Django, integrations or autobot)"
type = "forbidden"
source_modules = ["packs"]
forbidden_modules = ["integrations", "autobot", "config", "django"]

[[tool.importlinter.contracts]]
name = "A pack is imported only by packs.registry; autobot reaches packs only via the registry"
type = "protected"
protected_modules = ["packs.*"]
allowed_importers = ["packs.registry"]
ignore_imports = ["autobot -> packs.registry", "autobot.** -> packs.registry"]
unmatched_ignore_imports_alerting = "none"
