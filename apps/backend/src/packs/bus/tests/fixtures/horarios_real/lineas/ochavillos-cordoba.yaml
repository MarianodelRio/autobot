    dias: lunes-viernes
    tabla: |
      OCH    HER    FPA    VEN    FCU    COR
      09:45  09:50  10:00  10:05  10:15  10:55

  - temporada: anual
    dias: lunes-viernes
    tabla: |
      COR    FCU    VEN    FPA    HER    OCH
      12:30  13:10  13:20  13:25  13:35  13:40

pendientes: []
