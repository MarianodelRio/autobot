# horarios/lineas/badajoz-cordoba.yaml
# Horarios actualizados por negocio el 07/10/2026. El "desde 01/10/2026" de los
# títulos del Excel se lee como la fecha desde la que rigen, no como un cambio
# de temporada (P37).
# Fuente: Excel de negocio del 07/10/2026 («2026-10-07 ACTUALIZACION HORARIOS.xlsx», ya fuera del repo), hoja BADAJOZ (traspuesta:
# las paradas están en filas, no en columnas).
#
# De septiembre a julio, de lunes a jueves la ida termina en Zafra; de lunes a
# viernes la vuelta empieza en Zafra (confirmado por negocio): se modelan como
# viajes independientes que no cubren el tramo Zafra-Badajoz, no como un único
# viaje forzado.
#
# Agosto (P31, respuesta de negocio del 07/10/2026): de lunes a viernes la ida
# termina en Zafra (también el viernes) y la vuelta sale de Zafra; sábado,
# domingo y festivos (también el 15/08) no hay servicio. Las tablas de agosto
# repiten las horas de lunes a jueves y de la vuelta de septiembre-julio. Los
# domingos de agosto la línea de Peñarroya sí funciona (14:45 y 18:30): solo
# que no continúa a Badajoz.
#
# Villanueva del Rey: la columna VRC es el cruce (gasolinera), no el pueblo.
# P33 cerrada: PYA INV fila 49, Villanueva del Rey 19:10 sin marca amarilla →
# cruce, por la regla de P20. Se reabre si negocio no está de acuerdo.
nombre: Badajoz – Córdoba
telefono_demanda: "957 42 90 30"
avisos: [hora_aproximada]   # D-k
no_circula: []

temporadas:
  septiembre-julio: 01/09 - 31/07
  agosto: 01/08 - 31/08

dias:
  septiembre-julio: { lunes-jueves: horario, viernes: horario, sabado: sin_servicio, domingos-festivos: horario }
  agosto:           { lunes-viernes: horario, sabado: sin_servicio, domingos-festivos: sin_servicio }

horarios:
  # ── Ida: lunes a jueves (termina en Zafra, confirmado) ─────────────────────────
  - temporada: septiembre-julio
    dias: lunes-jueves
    tabla: |
      COR    VAC  CVH  ESP    VRC    BEL    PNR    FOB    CRN     GRA    AZU    BER    AHI    LLE    VGT     ZAF    VFB  ALM  MER  BAD
      15:00  -    -    15:40  15:55  16:05  16:20  16:40  16:45D  17:00  17:15  17:25  17:30  17:45  17:50D  18:15  -    -    -    -  | bus:cor-1500

  # ── Ida: viernes ─────────────────────────────────────────────────────────
