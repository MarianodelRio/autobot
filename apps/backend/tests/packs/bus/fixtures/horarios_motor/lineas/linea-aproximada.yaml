# Línea con aviso de ámbito línea (hora_aproximada), para probar que el
# resultado muestra "⚠️ Horarios de paso aproximados." sin marca numérica
# (como en una línea real con horas de paso aproximadas, no de salida fija).
nombre: Línea Aproximada
avisos: [hora_aproximada]
no_circula: []

temporadas:
  anual: todo el año

dias:
  anual: { lunes-viernes: horario, sabado: sin_servicio, domingos-festivos: sin_servicio }

horarios:
  - temporada: anual
    dias: lunes-viernes
    tabla: |
      RRR    SSS
      12:00  12:15

pendientes: []
