# Línea inventada con "solo_viernes_lectivo" (una salida extra solo en
# viernes dentro del curso escolar) y sin servicio el sábado. Odalla
# también tiene festivo local (ver calendario.yaml): ese día usa el
# horario de domingos-festivos aunque sea un miércoles o un viernes
# lectivo (que por festivo local pasa a la clase "festivos" y no activa
# "solo_viernes_lectivo").
nombre: Riomayor – Odalla
avisos: []
no_circula: []

temporadas:
  anual: todo el año

dias:
  anual: { lunes-viernes: horario, sabado: sin_servicio, domingos-festivos: horario }

horarios:
  - temporada: anual
    dias: lunes-viernes
    tabla: |
      RIO    ODA
      07:30  08:00
      16:00  16:30
      18:00  18:15  | solo_viernes_lectivo

  - temporada: anual
    dias: domingos-festivos
    tabla: |
      RIO    ODA
      09:00  09:30

pendientes: []
