# Línea principal, inventada: Pozoluengo - Carrascal - Riomayor. Varias
# salidas de lunes a viernes, menos el sábado y menos aún domingos/festivos
# (otro conjunto de horas, no un subconjunto). El último viaje de la tarde
# lleva "a demanda" en Carrascal (letra D) y un aviso de llegada a la
# estación en Riomayor (letra C): mismo patrón que `bus:<id>` compartido
# entre varias letras en una sola fila.
nombre: Pozoluengo – Riomayor
