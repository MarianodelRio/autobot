# Variante de paradas_base.yaml con el campo `pendientes:`.
# "montelirio" no lo usa ninguna
# línea (aparece en "Localidades que ninguna línea usa" de la revisión).
localidades:
  pueblo-a: { nombre: Pueblo A }
  pueblo-b: { nombre: Pueblo B }
  pueblo-c: { nombre: Pueblo C }
  montelirio: { nombre: Montelirio }

paradas:
  AAA: { nombre: Pueblo A, localidad: pueblo-a }
  BBB: { nombre: Pueblo B, localidad: pueblo-b }
  CCC: { nombre: Pueblo C, localidad: pueblo-c }
  CDB: { nombre: Montelirio, localidad: montelirio }

pendientes: [P32]
