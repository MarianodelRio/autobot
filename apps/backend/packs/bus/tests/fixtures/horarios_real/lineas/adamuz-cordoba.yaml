# horarios/lineas/adamuz-cordoba.yaml
# Horarios actualizados por negocio el 07/10/2026. El "desde 01/10/2026" de los
# títulos del Excel se lee como la fecha desde la que rigen, no como un cambio
# de temporada (P37).
# Fuente: Excel de negocio del 07/10/2026 («2026-10-07 ACTUALIZACION HORARIOS.xlsx», ya fuera del repo), hojas ADAMUZ INV y ADAMUZ VER.
#
# Notas internas del Excel ("no tendríamos que entrar en Rabanales, pero lo
# hacemos", "tendríamos que salir de Adamuz 11:35h...") no se publican (D-m):
# las horas transcritas son las que el autobús hace de verdad.
nombre: Adamuz – Villafranca – Córdoba
nombre_corto: Adamuz – Córdoba
avisos: [hora_aproximada]
no_circula: []

temporadas:
  invierno: 01/09 - 22/06   # confirmado por negocio
  verano: 23/06 - 31/08     # inicio provisional: depende de la apertura de Aquasierra, P30; fin confirmado por negocio

dias:
