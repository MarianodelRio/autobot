# Local development: production base with dev tools, mounted code and worker reload.
# Local-only passwords; production takes them from .env.
x-app: &app
  build:
    context: ../../apps/backend
    dockerfile: Dockerfile
    args:
      INSTALL_DEV: "true"
  image: autobot:local
  env_file:
    - path: ../../.env
      required: false
  environment:
    DB_APP_URL: postgres://fp_app:fp_app@db:5432/autobot
    DB_OWNER_URL: postgres://fp_owner:fp_owner@db:5432/autobot
    DB_READONLY_URL: postgres://fp_readonly:fp_readonly@db:5432/autobot
    GOOGLE_SERVICE_ACCOUNT_FILE: ${GOOGLE_SERVICE_ACCOUNT_FILE:+/app/google_sa.json}
    OPS_STATE_DIR: /tmp/ops  # the default resolves to /state in the container, not writable
    ENVIRONMENT: local
  volumes:
    - ../../apps/backend/src:/app/src
    - ../../apps/backend/manage.py:/app/manage.py
    - ./dev-worker.py:/dev-worker.py:ro
    # Empty by default; a configured local credential stays outside the image.
    - ${GOOGLE_SERVICE_ACCOUNT_FILE:-/dev/null}:/app/google_sa.json:ro
  depends_on:
    victorialogs:
      condition: service_started

services:
  web:
    <<: *app
    # Like production (bounded threads: runserver opens one thread per request with no
    # limit, and 250 concurrent requests exhausted PostgreSQL), plus --reload to pick up
    # code changes. DEBUG comes from ENVIRONMENT=local; the project serves no static files.
    command: gunicorn config.wsgi -b 0.0.0.0:8000 --workers 2 --threads 4 --no-control-socket --reload --timeout 60 --keep-alive 5 --access-logfile -
    ports:
      - "127.0.0.1:8000:8000"
    # Locally ONE web serves the webhooks and the panel's API, with fp_owner and
    # fp_readonly (the x-app environment above): there is no Caddy, no public edge and
    # no client data, and a second process would only slow down `--reload` and the
    # Vite proxy (127.0.0.1:8000). Production splits them (web / web-panel, ADR-020);
    # the alias lets the panel image, whose Caddy points at `web-panel`, work here too.
    networks:
      default:
        aliases: [web-panel]

  worker-inbound:
    <<: *app
    # Replaces the whole environment of x-app (it is not merged): repeat what it needs.
    environment:
      DB_APP_URL: postgres://fp_app:fp_app@db:5432/autobot
      SERVICE_NAME: worker-inbound
      ENVIRONMENT: local
      DB_CONN_MAX_AGE: "0"
      GOOGLE_SERVICE_ACCOUNT_FILE: ${GOOGLE_SERVICE_ACCOUNT_FILE:+/app/google_sa.json}
      DB_OWNER_URL: ""  # the worker never uses fp_owner
      DB_READONLY_URL: ""  # nor fp_readonly: it never runs the SQL console
    # The worker command and its queues come from compose.yaml; dev-worker.py wraps it
    # to reload on code changes.
    entrypoint: ["python", "/dev-worker.py"]
    restart: on-failure

  worker-calendar:
    <<: *app
    environment:
      DB_APP_URL: postgres://fp_app:fp_app@db:5432/autobot
      SERVICE_NAME: worker-calendar
      ENVIRONMENT: local
      DB_CONN_MAX_AGE: "0"
      GOOGLE_SERVICE_ACCOUNT_FILE: ${GOOGLE_SERVICE_ACCOUNT_FILE:+/app/google_sa.json}
      DB_OWNER_URL: ""  # the worker never uses fp_owner
      DB_READONLY_URL: ""  # nor fp_readonly: it never runs the SQL console
    entrypoint: ["python", "/dev-worker.py"]
    restart: on-failure

  worker-periodic:
    <<: *app
    environment:
      DB_APP_URL: postgres://fp_app:fp_app@db:5432/autobot
      SERVICE_NAME: worker-periodic
      ENVIRONMENT: local
      DB_CONN_MAX_AGE: "0"
      GOOGLE_SERVICE_ACCOUNT_FILE: ${GOOGLE_SERVICE_ACCOUNT_FILE:+/app/google_sa.json}
      DB_OWNER_URL: ""  # the worker never uses fp_owner
      DB_READONLY_URL: ""  # nor fp_readonly: it never runs the SQL console
    entrypoint: ["python", "/dev-worker.py"]
    restart: on-failure

  worker-outbound:
    <<: *app
    environment:
      DB_APP_URL: postgres://fp_app:fp_app@db:5432/autobot
      SERVICE_NAME: worker-outbound
      ENVIRONMENT: local
      DB_CONN_MAX_AGE: "0"
      GOOGLE_SERVICE_ACCOUNT_FILE: ${GOOGLE_SERVICE_ACCOUNT_FILE:+/app/google_sa.json}
      DB_OWNER_URL: ""  # the worker never uses fp_owner
      DB_READONLY_URL: ""  # nor fp_readonly: it never runs the SQL console
    entrypoint: ["python", "/dev-worker.py"]
    restart: on-failure

  # Only with `docker compose --profile panel up --build`: the production panel
  # image, to test its own Caddy and build (not pnpm panel-dev's Vite proxy).
  panel:
    build:
      # Repo root: the image also builds the documentation site (ADR-018).
      context: ../..
      dockerfile: apps/panel/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - web
    profiles: [panel]

  db:
    environment:
      POSTGRES_TEST_DB: test_autobot  # for the tests run from the host (make check)
    ports:
      - "127.0.0.1:5433:5432"  # 5433 so it does not clash with a PostgreSQL on the host
