# Base: what local and production share. Local adds dev tooling and local passwords
# (compose.local.yaml); production adds Caddy, GHCR images and restart policies
# (compose.prod.yaml). Relative paths here resolve against this directory.
services:
  web:
    environment:
      VICTORIALOGS_URL: http://victorialogs:9428
    depends_on:
      db:
        condition: service_healthy

  worker-inbound:
    environment:
      VICTORIALOGS_URL: http://victorialogs:9428
    depends_on:
      db:
        condition: service_healthy

  worker-outbound:
    environment:
      VICTORIALOGS_URL: http://victorialogs:9428
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    environment:
      POSTGRES_DB: autobot
      # Safe local defaults; compose.prod.yaml requires the real values instead.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      FP_OWNER_PASSWORD: ${FP_OWNER_PASSWORD:-fp_owner}
      FP_APP_PASSWORD: ${FP_APP_PASSWORD:-fp_app}
      FP_READONLY_PASSWORD: ${FP_READONLY_PASSWORD:-fp_readonly}
    volumes:
      - pgdata:/var/lib/postgresql
      - ../postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP: during the first init the server only listens on the socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d autobot"]
      interval: 5s
      timeout: 3s
      retries: 10

  victorialogs:
    image: victoriametrics/victoria-logs:v1.53.0
    command:
      - "-storageDataPath=/vlogs"
      - "-retentionPeriod=31d"
      - "-memory.allowedPercent=5"
      - "-httpListenAddr=:9428"
    volumes:
      - vlogs:/vlogs

volumes:
  pgdata:
  vlogs:
