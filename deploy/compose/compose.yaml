# Base: what local and production share. Local adds dev tooling and local passwords
# (compose.local.yaml); production adds Caddy, GHCR images and restart policies
# (compose.prod.yaml). Relative paths here resolve against this directory.
# What web and the workers share: where their logs go and the wait for the database.
x-app-base: &app-base
  environment:
    VICTORIALOGS_URL: http://victorialogs:9428
  depends_on:
    db:
      condition: service_healthy

services:
  web: *app-base

  # Four workers, so one slow dependency cannot starve the rest (ADR-023). Google
  # Calendar is only called from `inbound_ext` (the packs that need it: process_event of
  # the salon) and `periodic` (the calendar sweep). Each pool of slots is its own process:
  #   worker-inbound   inbound            conversation of packs with no external call, demo
  #                                       selector, owner chat, delivery statuses
  #   worker-calendar  inbound_ext        process_event of the packs that need Calendar
  #   worker-periodic  periodic, ops      sweeps, summaries, retry_stalled_jobs, cleanup
  #   worker-outbound  outbound           sends to Meta and Telegram
  # Only worker-periodic listens to `ops` (ops_check): its health checks call Meta,
  # Telegram and Google one after another and must never hold a slot that sends or answers
  # (the alert of a worker that is down comes from the external heartbeat, not from
  # ops_check). Graceful stop: on SIGTERM a worker takes no new
  # jobs and lets running ones finish for up to 50 s, within the 60 s before Docker
  # kills it; a cut job is retried (every job is idempotent). The local file prefixes
  # the command with its reloader.
  worker-inbound:
    <<: *app-base
    command: python manage.py procrastinate worker --queues inbound --concurrency 4 --shutdown-graceful-timeout 50
    stop_grace_period: 60s
    init: true

  worker-calendar:
    <<: *app-base
    command: python manage.py procrastinate worker --queues inbound_ext --concurrency 8 --shutdown-graceful-timeout 50
    stop_grace_period: 60s
    init: true

  worker-periodic:
    <<: *app-base
    command: python manage.py procrastinate worker --queues periodic,ops --concurrency 2 --shutdown-graceful-timeout 50
    stop_grace_period: 60s
    init: true

  worker-outbound:
    <<: *app-base
    command: python manage.py procrastinate worker --queues outbound --concurrency 8 --shutdown-graceful-timeout 50
    stop_grace_period: 60s
    init: true

  db:
    image: postgres:18@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    environment:
      POSTGRES_DB: autobot
      # Safe local defaults; compose.prod.yaml requires the real values instead.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      FP_OWNER_PASSWORD: ${FP_OWNER_PASSWORD:-fp_owner}
      FP_APP_PASSWORD: ${FP_APP_PASSWORD:-fp_app}
      FP_READONLY_PASSWORD: ${FP_READONLY_PASSWORD:-fp_readonly}
    volumes:
      - pgdata:/var/lib/postgresql
      - ../postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP: during the first init the server only listens on the socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d autobot"]
      interval: 5s
      timeout: 3s
      retries: 10
      # Crash recovery after an unclean stop can take longer than 10 x 5 s; failures
      # during this period do not count towards `retries`.
      start_period: 60s

  victorialogs:
    image: victoriametrics/victoria-logs:v1.53.0
    command:
      - "-storageDataPath=/vlogs"
      - "-retentionPeriod=31d"
      # belt-and-suspenders against the 31d time-based retention on a 40 GB
      # disk (A on 2 vCPU/4 GB): drops the oldest day first if this is hit before
      # time-based retention would have, instead of growing to fill the disk.
      - "-retention.maxDiskSpaceUsageBytes=5GiB"
      - "-memory.allowedPercent=5"
      - "-httpListenAddr=:9428"
    volumes:
      - vlogs:/vlogs

volumes:
  pgdata:
  vlogs:
