# Base: what local and production share. Local adds dev tooling and local passwords
# (compose.local.yaml); production adds Caddy, GHCR images and restart policies
# (compose.prod.yaml). Relative paths here resolve against this directory.
# What web and both workers share: where their logs go and the wait for the database.
x-app-base: &app-base
  environment:
    VICTORIALOGS_URL: http://victorialogs:9428
  depends_on:
    db:
      condition: service_healthy

services:
  web: *app-base

  # Two workers, so a Google Calendar outage cannot starve the sends: Google is
  # only called from `inbound` (the packs) and `periodic` (the salon calendar sweep),
  # both in worker-inbound; worker-outbound only sends. Both also listen to `ops`
  # (ops_check), so one worker staying down does not also silence its own alert.
  # Graceful stop: on SIGTERM a worker takes no new jobs and lets running ones finish
  # for up to 50 s, within the 60 s before Docker kills it; a cut job is retried
  # (every job is idempotent). The local file prefixes the command with its reloader.
  worker-inbound:
    <<: *app-base
    command: python manage.py procrastinate worker --queues inbound,periodic,ops --concurrency 2 --shutdown-graceful-timeout 50
    stop_grace_period: 60s
    init: true

  worker-outbound:
    <<: *app-base
    command: python manage.py procrastinate worker --queues outbound,ops --concurrency 2 --shutdown-graceful-timeout 50
    stop_grace_period: 60s
    init: true

  db:
    image: postgres:18@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    environment:
      POSTGRES_DB: autobot
      # Safe local defaults; compose.prod.yaml requires the real values instead.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      FP_OWNER_PASSWORD: ${FP_OWNER_PASSWORD:-fp_owner}
      FP_APP_PASSWORD: ${FP_APP_PASSWORD:-fp_app}
      FP_READONLY_PASSWORD: ${FP_READONLY_PASSWORD:-fp_readonly}
    volumes:
      - pgdata:/var/lib/postgresql
      - ../postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP: during the first init the server only listens on the socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d autobot"]
      interval: 5s
      timeout: 3s
      retries: 10

  victorialogs:
    image: victoriametrics/victoria-logs:v1.54.0
    command:
      - "-storageDataPath=/vlogs"
      - "-retentionPeriod=31d"
      # belt-and-suspenders against the 31d time-based retention on a 40 GB
      # disk (A on 2 vCPU/4 GB): drops the oldest day first if this is hit before
      # time-based retention would have, instead of growing to fill the disk.
      - "-retention.maxDiskSpaceUsageBytes=5GiB"
      - "-memory.allowedPercent=5"
      - "-httpListenAddr=:9428"
    volumes:
      - vlogs:/vlogs

volumes:
  pgdata:
  vlogs:
