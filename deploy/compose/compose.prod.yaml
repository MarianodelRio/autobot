# Production only. Variables come from the host .env; do not pass database owner
# credentials or the PostgreSQL bootstrap passwords to the worker.
x-app-env: &app-env
  ENVIRONMENT: prod
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS}
  DB_APP_URL: ${DB_APP_URL:?Set DB_APP_URL}
  SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:?Set SECRETS_ENCRYPTION_KEY}
  GOOGLE_SERVICE_ACCOUNT_FILE: /run/secrets/google_sa.json
  WHATSAPP_GRAPH_VERSION: ${WHATSAPP_GRAPH_VERSION:-v23.0}
  DEMO_TELEGRAM_TOKEN: ${DEMO_TELEGRAM_TOKEN:-}
  DEMO_TELEGRAM_WEBHOOK_SECRET: ${DEMO_TELEGRAM_WEBHOOK_SECRET:-}
  DEMO_TELEGRAM_USERS: ${DEMO_TELEGRAM_USERS:-}
  DEMO_TELEGRAM_BOT_USERNAME: ${DEMO_TELEGRAM_BOT_USERNAME:-}
  DEMO_WHATSAPP_PHONE_NUMBER_ID: ${DEMO_WHATSAPP_PHONE_NUMBER_ID:-}
  DEMO_WHATSAPP_WABA_ID: ${DEMO_WHATSAPP_WABA_ID:-}
  DEMO_WHATSAPP_DISPLAY_PHONE: ${DEMO_WHATSAPP_DISPLAY_PHONE:-}
  DEMO_WHATSAPP_APP_SECRET: ${DEMO_WHATSAPP_APP_SECRET:-}
  DEMO_WHATSAPP_ACCESS_TOKEN: ${DEMO_WHATSAPP_ACCESS_TOKEN:-}
  DEMO_WHATSAPP_VERIFY_TOKEN: ${DEMO_WHATSAPP_VERIFY_TOKEN:-}
  DEMO_WHATSAPP_USERS: ${DEMO_WHATSAPP_USERS:-}
  DEMO_WHATSAPP_MONTHLY_ALERT_THRESHOLD: ${DEMO_WHATSAPP_MONTHLY_ALERT_THRESHOLD:-300}
  # Missing from here until 2026-11-16: a new demo salon tenant kept the template's
  # placeholder calendar in production and could not book.
  DEMO_SALON_CALENDAR_ID: ${DEMO_SALON_CALENDAR_ID:-}
  PUBLIC_URL: ${PUBLIC_URL:-}
  NOTIFY_BOT_TOKEN: ${NOTIFY_BOT_TOKEN:-}
  NOTIFY_BOT_WEBHOOK_SECRET: ${NOTIFY_BOT_WEBHOOK_SECRET:-}
  OWNER_SUPPORT_EMAIL: ${OWNER_SUPPORT_EMAIL:-}
  PLATFORM_PRIVACY_URL: ${PLATFORM_PRIVACY_URL:-}
  OPS_TELEGRAM_CHAT_ID: ${OPS_TELEGRAM_CHAT_ID:-}
  SENTRY_DSN: ${SENTRY_DSN:-}
  HEALTHCHECKS_PING_URL: ${HEALTHCHECKS_PING_URL:-}
  RELEASE_SHA: ${SHA:?Set the published image SHA}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # On by default in production (approved by the person, 2026-11-23): the retention periods
  # of docs/procedimientos/retencion-rgpd.md only hold if it runs. `false` in the host .env
  # switches it off; check_prod_config.py watches it.
  RETENTION_CLEANUP_ENABLED: ${RETENTION_CLEANUP_ENABLED:-true}
  OPS_STATE_DIR: /run/ops

x-app: &app
  image: ${AUTOBOT_IMAGE:?Set AUTOBOT_IMAGE}:${SHA:?Set the published image SHA}
  # Match the host owner of mode-0600 secret files, while remaining non-root.
  user: ${DEPLOY_UID:?Set the numeric uid of the deploy user}
  environment: *app-env
  read_only: true
  # No capability is needed (everything listens on port 8000 as a non-root user) and
  # no-new-privileges stops a setuid binary from regaining any.
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:noexec,nosuid,size=64m  # gunicorn heartbeat files and Python temp files only
  volumes:
    - ../../var/google_sa.json:/run/secrets/google_sa.json:ro
    - ../../var/state/ops:/run/ops:ro
  restart: unless-stopped
  logging: &logging
    driver: json-file
    options:
      max-size: 20m
      max-file: "5"

# Networks (ADR-020): nothing reaches a service it has no reason to talk to.
#   edge   caddy, web             the public path; caddy reaches nothing else
#   panel  panel, web-panel       the SSH-tunnelled panel and its API (ADR-008, ADR-020)
#   egress worker-*               the workers' way out to Meta, Google and Telegram
#   data   db, web, web-panel,    PostgreSQL; `internal`, so db has no way out to the internet
#          worker-*
#   logs   victorialogs, web,     VictoriaLogs; `internal` as well
#          web-panel, worker-*
# web and web-panel also reach the internet through edge and panel respectively.
networks:
  edge: {}
  panel: {}
  egress: {}
  data:
    internal: true
  logs:
    internal: true

services:
  caddy:
    image: caddy:2@sha256:ce773ec7a742ce15ee6bf2bb5f65882b9e2a4487b10733e6f1484f86e6b5d8bc
    user: ${DEPLOY_UID:?Set the numeric uid of the deploy user}
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]  # binds 80/443; everything else it needs stays dropped
    security_opt:
      - no-new-privileges:true
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set the API hostname}
    ports:
      # localprod: overridable so it can run beside a real dev stack on the
      # same machine; production never sets these, so it keeps 80/443.
      - "${AUTOBOT_CADDY_HTTP_PORT:-80}:80"
      - "${AUTOBOT_CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../var/state/caddy-data:/data
      - ../../var/state/caddy-config:/config
    restart: unless-stopped
    logging: *logging
    mem_limit: 128m
    memswap_limit: 128m  # = mem_limit: no swap, so a leak is OOM-killed and restarted, not a slow swap storm
    pids_limit: 256
    networks: [edge]
    depends_on:
      web:
        condition: service_healthy
    # Caddy's admin API (localhost:2019 inside the container, the one `caddy reload` of
    # deploy.sh already uses): answers while the process is alive and its config is loaded.
    # busybox wget is in the image; no request leaves the container.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # The public side: webhooks and /health only, reached through caddy (ADR-005). Like
  # the workers it runs with fp_app alone: a bug or a compromise here never holds
  # fp_owner (BYPASSRLS) nor fp_readonly. The panel's API is web-panel (ADR-020).
  web:
    <<: *app
    environment:
      <<: *app-env
      DB_OWNER_URL: ""
      DB_READONLY_URL: ""
      SERVICE_NAME: web
    networks: [edge, data, logs]
    # The gunicorn command (flags, graceful timeout, access log format) is the image's
    # CMD in apps/backend/Dockerfile: one source of truth.
    stop_grace_period: 60s
    mem_limit: 640m
    memswap_limit: 640m  # = mem_limit: no swap, so a leak is OOM-killed and restarted, not a slow swap storm
    pids_limit: 256
    ports:
      - "127.0.0.1:${AUTOBOT_WEB_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  # The panel's API (ADR-020): the same image as web, but the only process with the
  # fp_owner and fp_readonly credentials besides one-off operation commands. It has no
  # published port and no edge network: only the panel container (and its Caddy) reach
  # it, on the `panel` network, and the SSH tunnel stops at the panel (ADR-008).
  web-panel:
    <<: *app
    environment:
      <<: *app-env
      DB_OWNER_URL: ${DB_OWNER_URL:?Set DB_OWNER_URL}
      DB_READONLY_URL: ${DB_READONLY_URL:?Set DB_READONLY_URL}
      SERVICE_NAME: web-panel
    stop_grace_period: 60s
    mem_limit: 512m
    memswap_limit: 512m  # = mem_limit: no swap, so a leak is OOM-killed and restarted, not a slow swap storm
    pids_limit: 256
    networks: [panel, data, logs]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  # The four workers (ADR-023); queues and concurrency are in compose.yaml. Per worker,
  # WORKER_DB_POOL_MAX bounds procrastinate's own pool (LISTEN, fetch, heartbeat and the
  # finish of each running job) and each job thread opens one Django connection on top
  # (closed when the job ends): concurrency + pool is the most it can hold. PYTHON_CPU_COUNT
  # sizes asyncio's default thread pool, which runs the sync jobs: min(32, cpus + 4)
  # threads, i.e. 6 on a 2-vCPU VPS, which would silently cap a --concurrency 8 worker.
  # Connections in the worst case (max_connections in db, below): web 2x4 threads + one
  # recycling worker = 12, web-panel 24, worker-inbound 4+8 = 12, worker-calendar 8+10 = 18,
  # worker-periodic 2+6 = 8, worker-outbound 8+10 = 18: 92, plus 5 reserved for superusers,
  # pg_dump, migrations and one-off commands: well under 200.
  worker-inbound:
    <<: *app
    environment:
      <<: *app-env
      DB_OWNER_URL: ""
      DB_READONLY_URL: ""
      SERVICE_NAME: worker-inbound
      DB_CONN_MAX_AGE: "0"  # procrastinate's own connection handling; no idle persistent ones
      WORKER_DB_POOL_MAX: "8"
      PYTHON_CPU_COUNT: "4"
    mem_limit: 384m
    memswap_limit: 384m  # = mem_limit: no swap, so a leak is OOM-killed and restarted, not a slow swap storm
    pids_limit: 128
    networks: [egress, data, logs]

  worker-calendar:
    <<: *app
    environment:
      <<: *app-env
      DB_OWNER_URL: ""
      DB_READONLY_URL: ""
      SERVICE_NAME: worker-calendar
      DB_CONN_MAX_AGE: "0"  # procrastinate's own connection handling; no idle persistent ones
      WORKER_DB_POOL_MAX: "10"
      PYTHON_CPU_COUNT: "6"
    mem_limit: 384m
    memswap_limit: 384m  # = mem_limit: no swap, so a leak is OOM-killed and restarted, not a slow swap storm
    pids_limit: 128
    networks: [egress, data, logs]

  worker-periodic:
    <<: *app
    environment:
      <<: *app-env
      DB_OWNER_URL: ""
      DB_READONLY_URL: ""
      SERVICE_NAME: worker-periodic
      DB_CONN_MAX_AGE: "0"  # procrastinate's own connection handling; no idle persistent ones
      WORKER_DB_POOL_MAX: "6"
      PYTHON_CPU_COUNT: "4"
    mem_limit: 384m
    memswap_limit: 384m  # = mem_limit: no swap, so a leak is OOM-killed and restarted, not a slow swap storm
    pids_limit: 128
    networks: [egress, data, logs]

  worker-outbound:
    <<: *app
    environment:
      <<: *app-env
      DB_OWNER_URL: ""
      DB_READONLY_URL: ""
      SERVICE_NAME: worker-outbound
      DB_CONN_MAX_AGE: "0"  # procrastinate's own connection handling; no idle persistent ones
      WORKER_DB_POOL_MAX: "10"
      PYTHON_CPU_COUNT: "6"
    mem_limit: 384m
    memswap_limit: 384m  # = mem_limit: no swap, so a leak is OOM-killed and restarted, not a slow swap storm
    pids_limit: 128
    networks: [egress, data, logs]

  panel:
    image: ${AUTOBOT_PANEL_IMAGE:?Set AUTOBOT_PANEL_IMAGE}:${SHA:?Set the published image SHA}
    user: ${DEPLOY_UID:?Set the numeric uid of the deploy user}
    ports:
      - "127.0.0.1:${AUTOBOT_PANEL_HOST_PORT:-8080}:8080"
    read_only: true
    # caddy's binary carries a file capability (cap_net_bind_service): with every
    # capability dropped it cannot even exec ("operation not permitted"), so this
    # one is kept although the panel listens on 8080.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
    restart: unless-stopped
    logging: *logging
    mem_limit: 64m
    memswap_limit: 64m  # = mem_limit: no swap, so a leak is OOM-killed and restarted, not a slow swap storm
    pids_limit: 128
    networks: [panel]
    depends_on:
      web-panel:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6

  db:
    cap_drop: [ALL]
    # The entrypoint starts as root to fix ownership/permissions on the data
    # directory, then su's to postgres: verified locally that cap-dropping to just
    # these five still lets it init and start (anything less and chmod/chown/the
    # su to postgres fails).
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE, SETUID, SETGID]
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      FP_OWNER_PASSWORD: ${FP_OWNER_PASSWORD:?Set FP_OWNER_PASSWORD}
      FP_APP_PASSWORD: ${FP_APP_PASSWORD:?Set FP_APP_PASSWORD}
      FP_READONLY_PASSWORD: ${FP_READONLY_PASSWORD:?Set FP_READONLY_PASSWORD}
    # Sized for the target VPS, 4 vCPU / 8 GB (docs/arquitectura/capacidad-y-crecimiento.md):
    # shared_buffers 1 GB (~1/8 of RAM, the rest is the OS page cache that
    # effective_cache_size tells the planner about), work_mem 8 MB per sort/hash node (the
    # 92 connections of the worst case rarely all sort at once), SSD-appropriate planner
    # costs, and fewer, smoother checkpoints (wal_compression, max_wal_size 2 GB, spread
    # over 90 % of the interval).
    # Slow-query log: OFF (log_min_duration_statement=-1) on purpose. Django binds
    # parameters in the client (psycopg's default), so a logged statement carries its
    # literal values (a phone number, a name) in the text; log_parameter_max_length only
    # covers server-side bound parameters, so it cannot make that log safe. Logs must hold no personal data
    # (CLAUDE.md). Turn it on only together with `server_side_binding` in Django's
    # DATABASES OPTIONS. log_parameter_max_length*=0 stays for the values of failed
    # server-bound queries.
    command:
      [
        "postgres",
        "-c", "shared_buffers=1GB",
        "-c", "effective_cache_size=4GB",
        "-c", "work_mem=8MB",
        "-c", "maintenance_work_mem=256MB",
        "-c", "random_page_cost=1.1",
        "-c", "effective_io_concurrency=200",
        "-c", "wal_compression=on",
        "-c", "checkpoint_completion_target=0.9",
        "-c", "max_wal_size=2GB",
        "-c", "max_connections=200",  # see the worker connection budget above
        "-c", "log_min_duration_statement=-1",
        "-c", "log_parameter_max_length=0",
        "-c", "log_parameter_max_length_on_error=0",
        "-c", "superuser_reserved_connections=5",
        "-c", "tcp_keepalives_idle=60",
        "-c", "tcp_keepalives_interval=10",
        "-c", "tcp_keepalives_count=6",
        "-c", "log_lock_waits=on",
      ]
    # Docker's default /dev/shm is 64 MB, too little for parallel queries' shared memory;
    # 512 MB covers the parallel workers' dynamic shared memory with 8 MB of work_mem.
    shm_size: 512mb
    # Gives PostgreSQL its fast shutdown time before SIGKILL.
    stop_grace_period: 60s
    # shared_buffers 1 GB + connections + maintenance_work_mem + page-cache headroom.
    # Sum of every mem_limit: caddy 128 + web 640 + web-panel 512 + 4 workers x 384 + panel 64
    # + db 2560 + victorialogs 320 = 5760 MB, leaving ~2.2 GB of the 8 GB for the kernel,
    # the page cache and the swap cushion.
    mem_limit: 2560m
    memswap_limit: 2560m  # = mem_limit: no swap, so a leak is OOM-killed and restarted, not a slow swap storm
    pids_limit: 200
    restart: unless-stopped
    logging: *logging
    networks: [data]

  # Root inside the container, but with no capability, no new privileges and a read-only
  # filesystem. A non-root user does not work: the image is scratch (no shell, no
  # chown) and the named volume is created root-owned, so VictoriaLogs could not write
  # /vlogs (checked 2026-11-22: it panics on start). Moving to a bind mount owned by
  # DEPLOY_UID would mean migrating the existing production volume; logs are not
  # critical and hold no client data (CLAUDE.md), so the residual risk is accepted.
  victorialogs:
    restart: unless-stopped
    logging: *logging
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
    mem_limit: 320m
    memswap_limit: 320m  # = mem_limit: no swap, so a leak is OOM-killed and restarted, not a slow swap storm
    pids_limit: 256
    networks: [logs]
