# Documentation site (Zensical, reads this MkDocs-compatible file). `make docs` serves it
# locally; `make docs-check` builds it in strict mode (broken links fail). The panel image
# builds it and serves it under /docs/ (ADR-018).
site_name: Autobot
site_description: Documentación de la plataforma Autobot
site_url: http://localhost:8080/docs/
docs_dir: docs
site_dir: var/docs-site
copyright: Documentación interna de Autobot

theme:
  name: material
  language: es
  font: false
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Modo claro

extra_css:
  - assets/stylesheets/extra.css

# Mermaid is vendored (mermaid 12.3.0, MIT): the theme only downloads it from unpkg when
# `window.mermaid` is missing, and the panel's CSP forbids external scripts. To update it,
# replace the file with dist/mermaid.min.js of the new npm version.
extra_javascript:
  - assets/javascripts/mermaid.min.js

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

plugins:
  - search:
      lang: es

