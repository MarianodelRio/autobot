# CI gates. If any fails, no image is published.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE: ghcr.io/marianodelrio/autobot
  PANEL_IMAGE: ghcr.io/marianodelrio/autobot-panel

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_DB: autobot
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d autobot"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      ENVIRONMENT: local
      DB_APP_URL: postgres://fp_app:fp_app@localhost:5432/autobot
      DB_OWNER_URL: postgres://fp_owner:fp_owner@localhost:5432/autobot
      DB_READONLY_URL: postgres://fp_readonly:fp_readonly@localhost:5432/autobot
    steps:
      - uses: actions/checkout@v7
      - name: Database roles
        # Same script as the db container; the service cannot mount repo files.
        run: bash deploy/postgres/init-roles.sh
        env:
          PGHOST: localhost
          PGPASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: autobot
          POSTGRES_TEST_DB: test_autobot
          FP_OWNER_PASSWORD: fp_owner
          FP_APP_PASSWORD: fp_app
          FP_READONLY_PASSWORD: fp_readonly
      # The same uv as the image: its version is read from the Dockerfile, so a
      # Dependabot bump of the image's uv updates CI too.
      - id: uv
        run: |
          version=$(sed -n 's|^FROM ghcr.io/astral-sh/uv:\([0-9.]*\) AS uv$|\1|p' deploy/docker/backend.Dockerfile)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ steps.uv.outputs.version }}
          enable-cache: true
      - run: uv sync --locked
      - name: No tenant data in git
        run: test -z "$(git ls-files tenants datos)"
      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck deploy/*.sh deploy/postgres/*.sh apps/backend/tools/*.sh
      - name: mypy
        run: uv run mypy
      - name: import-linter
        run: PYTHONPATH=apps/backend uv run lint-imports
      - name: pytest
        run: uv run pytest
      - name: Migrations
        run: |
          uv run python manage.py makemigrations --check --dry-run
          uv run python manage.py lintmigrations
      - name: OpenAPI schema is committed
        run: |
          uv run python manage.py export_openapi apps/panel/openapi.json
          git diff --exit-code apps/panel/openapi.json
      - name: pip-audit
        run: |
          uv export --locked --all-groups --no-emit-project --format requirements.txt -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 --disable-pip --require-hashes -r "$RUNNER_TEMP/requirements.txt"

  panel:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/panel/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/panel/pnpm-lock.yaml
      - run: pnpm -C apps/panel install --frozen-lockfile
      - name: Generated API types are committed
        run: |
          pnpm -C apps/panel gen:api
          git diff --exit-code apps/panel/src/api/schema.d.ts
      - run: pnpm -C apps/panel check
      - run: pnpm -C apps/panel typecheck
      - run: pnpm -C apps/panel test
      - run: pnpm -C apps/panel build
      - name: Generated route tree is committed
        run: git diff --exit-code apps/panel/src/routeTree.gen.ts

  image:
    needs: [check, panel]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/backend.Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - uses: docker/build-push-action@v7
        with:
          context: apps/panel
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ env.PANEL_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=panel
          cache-to: type=gha,mode=max,scope=panel
