# CI gates (design.md §17.3). If any fails, no image is published.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE: ghcr.io/marianodelrio/flowpilot

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_DB: flowpilot
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d flowpilot"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      ENVIRONMENT: local
      DB_APP_URL: postgres://fp_app:fp_app@localhost:5432/flowpilot
      DB_OWNER_URL: postgres://fp_owner:fp_owner@localhost:5432/flowpilot
    steps:
      - uses: actions/checkout@v7
      - name: Database roles
        # Same script as the db container; the service cannot mount repo files.
        run: bash deploy/postgres/init-roles.sh
        env:
          PGHOST: localhost
          PGPASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: flowpilot
          POSTGRES_TEST_DB: test_flowpilot
          FP_OWNER_PASSWORD: fp_owner
          FP_APP_PASSWORD: fp_app
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.4"
          enable-cache: true
      - run: uv sync --locked
      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: mypy
        run: uv run mypy
      - name: import-linter
        run: PYTHONPATH=src uv run lint-imports
      - name: pytest
        run: uv run pytest
      - name: Migrations
        run: |
          uv run python manage.py makemigrations --check --dry-run
          uv run python manage.py lintmigrations
      - name: pip-audit
        run: |
          uv export --locked --all-groups --no-emit-project --format requirements.txt -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 --disable-pip --require-hashes -r "$RUNNER_TEMP/requirements.txt"

  image:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
