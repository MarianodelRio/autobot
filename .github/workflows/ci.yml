# CI gates. If any fails, no image is published.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # lint, test and audit run in parallel; `image` waits for all of them.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ENVIRONMENT: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The same uv as the image: its version is read from the Dockerfile, so a
      # Dependabot bump of the image's uv updates CI too.
      - id: uv
        run: |
          version=$(sed -n 's|^FROM ghcr.io/astral-sh/uv:\([0-9.]*\)@sha256:[0-9a-f]\{64\} AS uv$|\1|p' apps/backend/Dockerfile)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ steps.uv.outputs.version }}
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock
      - run: uv sync --locked
        working-directory: apps/backend
      - name: No tenant data in git
        # Tenant data and runtime files live under var/ (ignored by git); nothing of
        # that kind may be versioned: not under any var/, nor data files under any
        # tenants/ or datos/ directory, except test fixtures and pack templates.
        run: |
          bad=$(git ls-files | {
            grep -E '(^|/)var/|(^|/)(tenants|datos)/.*\.(ya?ml|json|csv|md|txt|pdf|xlsx?|sql|dump)$' || true
          } | {
            grep -vE '^apps/backend/tests/|^apps/backend/src/packs/[^/]+/template/' || true
          })
          if [ -n "$bad" ]; then
            echo "Tenant or runtime data must not be versioned:" >&2
            echo "$bad" >&2
            exit 1
          fi
      - name: ruff
        working-directory: apps/backend
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: shellcheck
        # Preinstalled on the ubuntu-24.04 runner. -x -P: follow
        # `source "$(dirname "$0")/lib.sh"` (a dynamic path, so shellcheck won't
        # resolve it on its own) to the real deploy/scripts/lib.sh.
        run: shellcheck -x -P deploy/scripts deploy/scripts/*.sh deploy/postgres/*.sh apps/backend/src/tools/*/*.sh
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: apps/backend/.mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('apps/backend/uv.lock') }}-${{ github.sha }}
          restore-keys: |
            mypy-${{ runner.os }}-${{ hashFiles('apps/backend/uv.lock') }}-
      - name: mypy
        working-directory: apps/backend
        run: uv run mypy
      - name: import-linter
        working-directory: apps/backend
        run: PYTHONPATH=src uv run lint-imports

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_DB: autobot
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d autobot"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      ENVIRONMENT: local
      DB_APP_URL: postgres://fp_app:fp_app@localhost:5432/autobot
      DB_OWNER_URL: postgres://fp_owner:fp_owner@localhost:5432/autobot
      DB_READONLY_URL: postgres://fp_readonly:fp_readonly@localhost:5432/autobot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Database roles
        # Same script as the db container; the service cannot mount repo files.
        run: bash deploy/postgres/init-roles.sh
        env:
          PGHOST: localhost
          PGPASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: autobot
          POSTGRES_TEST_DB: test_autobot
          FP_OWNER_PASSWORD: fp_owner
          FP_APP_PASSWORD: fp_app
          FP_READONLY_PASSWORD: fp_readonly
      # The same uv as the image: its version is read from the Dockerfile, so a
      # Dependabot bump of the image's uv updates CI too.
      - id: uv
        run: |
          version=$(sed -n 's|^FROM ghcr.io/astral-sh/uv:\([0-9.]*\)@sha256:[0-9a-f]\{64\} AS uv$|\1|p' apps/backend/Dockerfile)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ steps.uv.outputs.version }}
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock
      - run: uv sync --locked
        working-directory: apps/backend
      - name: pytest
        working-directory: apps/backend
        run: uv run pytest
      - name: Migrations
        working-directory: apps/backend
        run: |
          uv run python manage.py makemigrations --check --dry-run
          uv run python manage.py lintmigrations
      - name: OpenAPI schema is committed
        run: |
          uv run --project apps/backend python apps/backend/manage.py export_openapi apps/panel/openapi.json
          git diff --exit-code apps/panel/openapi.json

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The same uv as the image: its version is read from the Dockerfile, so a
      # Dependabot bump of the image's uv updates CI too.
      - id: uv
        run: |
          version=$(sed -n 's|^FROM ghcr.io/astral-sh/uv:\([0-9.]*\)@sha256:[0-9a-f]\{64\} AS uv$|\1|p' apps/backend/Dockerfile)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ steps.uv.outputs.version }}
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock
      - name: pip-audit
        working-directory: apps/backend
        run: |
          uv export --locked --all-groups --no-emit-project --format requirements.txt -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 --disable-pip --require-hashes -r "$RUNNER_TEMP/requirements.txt"

  forbidden-terms:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 deploy/scripts/check-forbidden-terms.py

  secrets-scan:
    # gitleaks over the whole history (fetch-depth 0). Allowlists live in .gitleaks.toml.
    # The binary is pinned by version and sha256 (no third-party action, no licence key).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum verified)
        run: |
          version=8.30.1
          sha256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          echo "$sha256  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/gitleaks" && tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/gitleaks" gitleaks
      - name: gitleaks
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" git --config .gitleaks.toml --redact --verbose .'

  dockerfile-lint:
    # hadolint on both Dockerfiles, plus actionlint on the workflows. Binaries pinned by
    # version and sha256.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install hadolint (checksum verified)
        run: |
          version=2.15.1
          sha256=c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
          curl -fsSL -o "$RUNNER_TEMP/hadolint" \
            "https://github.com/hadolint/hadolint/releases/download/v${version}/hadolint-linux-x86_64"
          echo "$sha256  $RUNNER_TEMP/hadolint" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/hadolint"
      - name: hadolint
        run: '"$RUNNER_TEMP/hadolint" apps/backend/Dockerfile apps/panel/Dockerfile'
      - name: Install actionlint (checksum verified)
        run: |
          version=1.7.12
          sha256=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz"
          echo "$sha256  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/actionlint" && tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP/actionlint" actionlint
      - name: actionlint
        run: '"$RUNNER_TEMP/actionlint/actionlint" -color'

  panel:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: apps/panel/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/panel/pnpm-lock.yaml
      - run: pnpm -C apps/panel install --frozen-lockfile
      - name: pnpm audit (production dependencies)
        run: pnpm -C apps/panel audit --prod --audit-level high
      - name: Generated API types are committed
        run: |
          pnpm -C apps/panel gen:api
          git diff --exit-code apps/panel/src/api/schema.d.ts
      - run: pnpm -C apps/panel check
      - run: pnpm -C apps/panel typecheck
      - run: pnpm -C apps/panel test
      - run: pnpm -C apps/panel build
      - name: Generated route tree is committed
        run: git diff --exit-code apps/panel/src/routeTree.gen.ts

  docs:
    # The documentation site builds in strict mode (a broken link or snippet fails), with
    # the same Zensical the panel image uses (`docs` group of apps/backend/uv.lock).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: uv
        run: |
          version=$(sed -n 's|^FROM ghcr.io/astral-sh/uv:\([0-9.]*\)@sha256:[0-9a-f]\{64\} AS uv$|\1|p' apps/backend/Dockerfile)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ steps.uv.outputs.version }}
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock
      - run: uv run --project apps/backend --only-group docs --frozen zensical build --strict -f mkdocs.yml

  deploy-smoke:
    # catches a compose file that no longer parses, or a backup/restore that no
    # longer round-trips, before it reaches `main` instead of at the next real
    # restore. Runs in parallel with `lint`/`test`/`panel`; `image` waits for it too.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install restic
        run: sudo apt-get update -qq && sudo apt-get install -y -qq restic
      - name: Production compose file is valid
        run: |
          env \
            PUBLIC_HOST=ci.example.invalid SHA="$(git rev-parse HEAD)" \
            AUTOBOT_IMAGE=ghcr.io/example-owner/autobot \
            AUTOBOT_PANEL_IMAGE=ghcr.io/example-owner/autobot-panel \
            DEPLOY_UID=1000 DJANGO_SECRET_KEY=x DJANGO_ALLOWED_HOSTS=x \
            DB_APP_URL=postgres://x:x@db:5432/x SECRETS_ENCRYPTION_KEY=x \
            DB_OWNER_URL=postgres://x:x@db:5432/x DB_READONLY_URL=postgres://x:x@db:5432/x \
            POSTGRES_PASSWORD=x FP_OWNER_PASSWORD=x FP_APP_PASSWORD=x FP_READONLY_PASSWORD=x \
            docker compose -f deploy/compose/compose.yaml -f deploy/compose/compose.prod.yaml \
            config -q
      - name: Local compose file is valid
        run: |
          docker compose -f deploy/compose/compose.yaml -f deploy/compose/compose.local.yaml config -q
          docker compose -f deploy/compose/compose.yaml -f deploy/compose/compose.local.yaml --profile panel config -q
      - name: Caddyfiles are valid
        # The same Caddy images as production: the server's one is read from the compose
        # file and the panel's from its Dockerfile, so a Dependabot bump is validated too.
        run: |
          server_image=$(sed -n 's|^    image: \(caddy:.*\)$|\1|p' deploy/compose/compose.prod.yaml)
          panel_image=$(sed -n 's|^FROM \(caddy:[^ ]*\) AS runtime$|\1|p' apps/panel/Dockerfile)
          test -n "$server_image" && test -n "$panel_image"
          docker run --rm -e PUBLIC_HOST=ci.example.invalid \
            -v "$PWD/deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            "$server_image" caddy validate --config /etc/caddy/Caddyfile
          docker run --rm -v "$PWD/apps/panel/Caddyfile:/etc/caddy/Caddyfile:ro" \
            "$panel_image" caddy validate --config /etc/caddy/Caddyfile
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Date of the Debian security updates layer
        # The Dockerfile's apt-get upgrade layer is keyed on it: rebuilt once a day.
        run: echo "SECURITY_UPDATES_DATE=$(date -u +%F)" >>"$GITHUB_ENV"
      - name: Build the backend image with the shared layer cache
        # Same cache scope as `image`; restore-test.sh skips its own build for this one.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: apps/backend
          file: apps/backend/Dockerfile
          load: true
          tags: autobot:restore-test
          build-args: SECURITY_UPDATES_DATE=${{ env.SECURITY_UPDATES_DATE }}
          cache-from: type=gha,scope=app
      - name: Backup/restore round-trip (make restore-test)
        run: AUTOBOT_RESTORE_TEST_SKIP_BUILD=true bash deploy/scripts/restore-test.sh

  image:
    needs: [lint, test, audit, panel, docs, forbidden-terms, deploy-smoke, secrets-scan, dockerfile-lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Compute image names
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          # SECURITY_UPDATES_DATE keys the Dockerfile's apt-get upgrade layer: rebuilt once a day.
          {
            echo "IMAGE=ghcr.io/$owner/autobot"
            echo "PANEL_IMAGE=ghcr.io/$owner/autobot-panel"
            echo "SECURITY_UPDATES_DATE=$(date -u +%F)"
          } >>"$GITHUB_ENV"
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Build both images locally first, scan them, and only then publish: a HIGH or
      # CRITICAL vulnerability with a fix available stops the pipeline before any push.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: apps/backend
          file: apps/backend/Dockerfile
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: SECURITY_UPDATES_DATE=${{ env.SECURITY_UPDATES_DATE }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: apps/panel/Dockerfile
          load: true
          tags: ${{ env.PANEL_IMAGE }}:${{ github.sha }}
          build-args: VITE_GITHUB_REPO=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=panel
          cache-to: type=gha,mode=max,scope=panel
      - name: Install Trivy (checksum verified)
        run: |
          version=0.76.2
          sha256=bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
          curl -fsSL -o "$RUNNER_TEMP/trivy.tgz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${version}/trivy_${version}_Linux-64bit.tar.gz"
          echo "$sha256  $RUNNER_TEMP/trivy.tgz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/trivy" && tar -xzf "$RUNNER_TEMP/trivy.tgz" -C "$RUNNER_TEMP/trivy" trivy
      - name: Trivy scan (HIGH/CRITICAL with a fix available fail the build)
        run: |
          for image in "$IMAGE:$GITHUB_SHA" "$PANEL_IMAGE:$GITHUB_SHA"; do
            "$RUNNER_TEMP/trivy/trivy" image --scanners vuln --severity HIGH,CRITICAL \
              --ignore-unfixed --exit-code 1 --no-progress "$image"
          done
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        name: Publish images
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$PANEL_IMAGE:$GITHUB_SHA"
