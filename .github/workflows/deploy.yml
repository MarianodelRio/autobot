name: Deploy

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character SHA of a successful main build
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify requested commit and published image
        env:
          SHA: ${{ inputs.sha }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$SHA" origin/main
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify published image
        env:
          SHA: ${{ inputs.sha }}
        run: |
          docker manifest inspect ghcr.io/marianodelrio/autobot:"$SHA" >/dev/null
      - name: Install deploy key and pinned host
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" >~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" >~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Deploy
        env:
          SHA: ${{ inputs.sha }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            deploy@"$HOST" "deploy/deploy.sh $SHA"
