version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    # Django stays on the 5.2 LTS (design.md §0, §18): only its patch releases.
    ignore:
      - dependency-name: django
        versions: [">=5.3"]
      - dependency-name: django-stubs
        versions: [">=5.3"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
