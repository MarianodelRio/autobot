# Production only. Variables come from the host .env; do not pass database owner
# credentials or the PostgreSQL bootstrap passwords to the worker.
x-app-env: &app-env
  ENVIRONMENT: prod
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS}
  DB_APP_URL: ${DB_APP_URL:?Set DB_APP_URL}
  SECRETS_FILE: /run/secrets/secrets.yaml
  GOOGLE_SERVICE_ACCOUNT_FILE: /run/secrets/google_sa.json
  WHATSAPP_GRAPH_VERSION: ${WHATSAPP_GRAPH_VERSION:-v23.0}
  DEMO_TELEGRAM_TOKEN: ${DEMO_TELEGRAM_TOKEN:-}
  DEMO_TELEGRAM_WEBHOOK_SECRET: ${DEMO_TELEGRAM_WEBHOOK_SECRET:-}
  DEMO_TELEGRAM_USERS: ${DEMO_TELEGRAM_USERS:-}
  PUBLIC_URL: ${PUBLIC_URL:-}
  NOTIFY_BOT_TOKEN: ${NOTIFY_BOT_TOKEN:-}
  OPS_TELEGRAM_CHAT_ID: ${OPS_TELEGRAM_CHAT_ID:-}
  SENTRY_DSN: ${SENTRY_DSN:-}
  HEALTHCHECKS_PING_URL: ${HEALTHCHECKS_PING_URL:-}
  RELEASE_SHA: ${SHA:?Set the published image SHA}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  RETENTION_CLEANUP_ENABLED: ${RETENTION_CLEANUP_ENABLED:-false}

x-app: &app
  image: ghcr.io/marianodelrio/flowpilot:${SHA:?Set the published image SHA}
  # Match the host owner of mode-0600 secret files, while remaining non-root.
  user: ${DEPLOY_UID:?Set the numeric uid of the deploy user}
  environment: *app-env
  read_only: true
  tmpfs:
    - /tmp
  volumes:
    - ./secrets.yaml:/run/secrets/secrets.yaml:ro
    - ./google_sa.json:/run/secrets/google_sa.json:ro
  restart: unless-stopped
  logging: &logging
    driver: json-file
    options:
      max-size: 20m
      max-file: "5"
  depends_on:
    db:
      condition: service_healthy

services:
  caddy:
    image: caddy:2
    user: ${DEPLOY_UID:?Set the numeric uid of the deploy user}
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set the API hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./state/caddy-data:/data
      - ./state/caddy-config:/config
    restart: unless-stopped
    logging: *logging
    depends_on:
      web:
        condition: service_healthy

  web:
    <<: *app
    environment:
      <<: *app-env
      DB_OWNER_URL: ${DB_OWNER_URL:?Set DB_OWNER_URL}
      SERVICE_NAME: web
    command: gunicorn config.wsgi -b 0.0.0.0:8000 --workers 2 --threads 4 --no-control-socket
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  worker:
    <<: *app
    environment:
      <<: *app-env
      DB_OWNER_URL: ""
      SERVICE_NAME: worker
    command: python manage.py procrastinate worker --concurrency 4 --shutdown-graceful-timeout 50
    stop_grace_period: 60s
    init: true

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: flowpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      FP_OWNER_PASSWORD: ${FP_OWNER_PASSWORD:?Set FP_OWNER_PASSWORD}
      FP_APP_PASSWORD: ${FP_APP_PASSWORD:?Set FP_APP_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./deploy/postgres:/docker-entrypoint-initdb.d:ro
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "max_connections=100", "-c", "log_min_duration_statement=1000"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d flowpilot"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
