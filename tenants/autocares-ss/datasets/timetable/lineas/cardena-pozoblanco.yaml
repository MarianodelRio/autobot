# horarios/lineas/cardena-pozoblanco.yaml
# Horarios actualizados por negocio el 07/10/2026. El "desde 01/10/2026" de los
# títulos del Excel se lee como la fecha desde la que rigen, no como un cambio
# de temporada (P37).
# Fuente: Excel de negocio del 07/10/2026 («2026-10-07 ACTUALIZACION HORARIOS.xlsx», ya fuera del repo), hojas TORR INV y TORR VER (filas 38-43 de INV y 39-44 de VER).
# En agosto esta línea no circula (D-d): "EN AGOSTO LINEA CARDEÑA - POZOBLANCO
# NO ESTARÁ DISPONIBLE" (TORR VER, fila 36).
nombre: Cardeña
avisos: [hora_aproximada]
no_circula: [agosto]

temporadas:
  invierno: 15/09 - 22/06
  verano: 23/06 - 14/09

dias:
  invierno: { lunes-viernes: horario, sabado: sin_servicio, domingos-festivos: sin_servicio }
  verano:   { lunes-viernes: horario, sabado: sin_servicio, domingos-festivos: sin_servicio }

horarios:
  # ── INVIERNO — lunes a viernes ──────────────────────────────
  - temporada: invierno
    dias: lunes-viernes
    tabla: |
      CAR    VVC    POZ
      09:00  09:30  10:00

  - temporada: invierno
    dias: lunes-viernes
    tabla: |
      POZ    VVC    CAR
      13:10  13:35  14:15

  # ── VERANO — lunes a viernes ──────────────────────────────
  - temporada: verano
    dias: lunes-viernes
    tabla: |
      CAR    VVC    POZ
      09:00  09:30  10:00

  - temporada: verano
    dias: lunes-viernes
    tabla: |
      POZ    VVC    CAR
      13:10  13:35  14:15

pendientes: []
