  contact_phone: "600 000 000"
  # Marcador explícito: sustitúyelo por el id real del calendario "FlowPilot
  # demo" (docs/mejoras/01-bot-de-demo.md §8) antes de pasar status a "active".
  calendar_id: PENDIENTE-calendario-de-demo
  services:
    corte:
      name: Corte de pelo
      price_eur: 15
      duration_min: 30
      client_presence_min: 30
    corte_barba:
      name: Corte y barba
      price_eur: 20
      duration_min: 45
      client_presence_min: 45
    tinte:
      name: Tinte
      price_eur: 35
      duration_min: 60
      client_presence_min: 90
