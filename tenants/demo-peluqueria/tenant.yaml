# tenants/demo-peluqueria/tenant.yaml — negocio de demo del pack salon.
# Creado con `manage.py new_tenant demo-peluqueria --pack salon --demo "..."`.
# status queda en "paused" hasta que la persona ponga su calendario de verdad
# (docs/mejoras/01-bot-de-demo.md §8) y lo pase a "active"; el owner lo completa
# ella misma con `manage.py notify_link demo-peluqueria` y después debe añadir
# `notify: [booking_created, booking_cancelled, booking_moved, move_cancel_failed]`.
