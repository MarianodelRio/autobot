# Copiar a secrets.yaml en la VPS con permisos 0600. No incluir valores reales en git.
# La clave de cada bloque es el slug del tenant.
example-whatsapp:
  app_secret: replace-with-meta-app-secret
  access_token: replace-with-permanent-system-user-token
  verify_token: replace-with-random-verify-token
example-telegram:
  bot_token: replace-with-telegram-bot-token
  webhook_secret: replace-with-random-32-character-secret
