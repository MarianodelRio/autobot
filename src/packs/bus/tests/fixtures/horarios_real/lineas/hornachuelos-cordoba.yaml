# horarios/lineas/hornachuelos-cordoba.yaml
# Horarios actualizados por negocio el 07/10/2026. El "desde 01/10/2026" de los
# títulos del Excel se lee como la fecha desde la que rigen, no como un cambio
# de temporada (P37).
# Fuente: Excel de negocio del 07/10/2026 («2026-10-07 ACTUALIZACION HORARIOS.xlsx», ya fuera del repo), hojas POSADAS INV y
# POSADAS VER.
#
# Rivero de Posadas (RIV) y Los Mochos (MOC) son columnas (P32, respuesta de
# negocio del 07/10/2026): llevan la misma hora que Posadas y que Almodóvar,
# respectivamente, solo en los viajes marcados en el Excel (naranja = Rivero,
# verde = Los Mochos). En el resto de viajes llevan `-`. Posadas → Rivero y
# Almodóvar → Los Mochos quedan a 0 minutos: es lo que dice negocio.
# El asterisco del Excel (no para en El Pedrera, calle Sevilla) es la letra E
# en la celda de Posadas (P16): solo se muestra con origen o destino Posadas.
# Las notas internas de POSADAS VER r38/r39 no se publican (D-m).
#
# Posadas 08:30 (ida, lunes a viernes) ya no lleva asterisco: cambio de la
# empresa en el Excel modificado; ahora para en El Pedrera.
#
# Domingo, 09:30 desde Hornachuelos: Almodóvar 10:15 (P36, respuesta de negocio
# del 07/10/2026; fila 45 de POSADAS INV y VER).
