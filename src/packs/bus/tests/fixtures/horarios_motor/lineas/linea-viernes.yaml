# Condición viernes-lectivo: viaje1 la lleva a nivel de parada (letra V, solo
# en la llegada a C; pasa por B sin condición); viaje2 la lleva a nivel de
# viaje (afecta a cualquier pareja de ese viaje, incluida A->B).
nombre: Línea Viernes
avisos: []
no_circula: []

temporadas:
  anual: todo el año

dias:
  anual: { lunes-viernes: horario, sabado: sin_servicio, domingos-festivos: sin_servicio }

horarios:
  - temporada: anual
    dias: lunes-viernes
    tabla: |
      AAA    BBB    CCC
      08:00  08:10  08:20V
      09:00  09:10  09:20  | solo_viernes_lectivo

pendientes: []
